<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>GIS Map</title>
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            font-family: sans-serif;
        }

        #app {
            display: flex;
            height: 100%;
        }

        #panel {
            width: 420px;
            padding: 12px;
            overflow: auto;
        }

        #map {
            flex: 1;
        }
    </style>
    <div id="app">
        <div id="panel">
            <input id="q" placeholder="Что нужно сделать?" style="width:100%">
            <label>Доступность <input id="acc" type="range" min="0" max="100" value="50"></label>
            <p></p>
            <label>Стоимость <input id="cost" type="range" min="0" max="100" value="40"></label>
            <table id="results"></table>
        </div>
        <div id="map"></div>
    </div>
</head>

<body>
    <div id="map"></div>
    <script>
        var isMapReady = false;
        var pendingActions = [];
        var connectionLines = [];

        document.addEventListener('DOMContentLoaded', loadYandexMaps);

        function loadYandexMaps() {
            var s = document.createElement('script');
            s.type = 'text/javascript';
            s.src = 'https://api-maps.yandex.ru/2.1/?apikey=f301d10c-f98b-4229-a923-46dab208b6d9&lang=ru_RU';
            s.onload = function () {
                ymaps.ready(function () {
                    window.map = new ymaps.Map('map', {
                        center: [55.0, 48.0],
                        zoom: 6
                    });
                    isMapReady = true;
                    for (var i = 0; i < pendingActions.length; i++) {
                        pendingActions[i]();
                    }
                    pendingActions = [];
                });
            };
            document.head.appendChild(s);
        }

        function clearMap() {
            if (!isMapReady) { pendingActions.push(function () { clearMap(); }); return; }
            clearConnections();
            map.geoObjects.removeAll();
        }

        function addPoint(lat, lon, color, text, enterpriseName) {
            if (!isMapReady) { pendingActions.push(function () { addPoint(lat, lon, color, text, enterpriseName); }); return; }
            var p = new ymaps.Placemark(
                [lat, lon],
                { balloonContent: text },
                { preset: 'islands#circleIcon', iconColor: color }
            );
            var eName = enterpriseName;
            p.events.add('click', function () { onEnterpriseClick(eName, lat, lon); });
            map.geoObjects.add(p);
        }

        function showConnections(centerLat, centerLon, similarPoints) {
            if (!isMapReady) { pendingActions.push(function () { showConnections(centerLat, centerLon, similarPoints); }); return; }
            clearConnections();
            var cLat = Number(centerLat);
            var cLon = Number(centerLon);
            if (typeof similarPoints === 'string') {
                try { similarPoints = JSON.parse(similarPoints); } catch (e) { return; }
            }
            if (!Array.isArray(similarPoints)) return;
            for (var i = 0; i < similarPoints.length; i++) {
                var point = similarPoints[i];
                var pLat = Number(point.lat);
                var pLon = Number(point.lon);
                if (isNaN(pLat) || isNaN(pLon)) continue;
                var line = new ymaps.Polyline(
                    [[cLat, cLon], [pLat, pLon]],
                    { balloonContent: 'Общих категорий: ' + (point.shared_categories || 0) + '<br>Общих задач: ' + (point.shared_tasks || 0) },
                    { strokeColor: '#1E88E5', strokeWidth: 3, strokeOpacity: 0.8, strokeStyle: 'dash' }
                );
                map.geoObjects.add(line);
                connectionLines.push(line);
                var pm = new ymaps.Placemark(
                    [pLat, pLon],
                    { balloonContent: (point.name || '') + '<br>Схожих категорий: ' + (point.shared_categories || 0) + '<br>Схожих задач: ' + (point.shared_tasks || 0) },
                    { preset: 'islands#blueCircleIcon' }
                );
                map.geoObjects.add(pm);
                connectionLines.push(pm);
            }
        }

        function clearConnections() {
            if (!isMapReady) return;
            for (var i = 0; i < connectionLines.length; i++) {
                map.geoObjects.remove(connectionLines[i]);
            }
            connectionLines = [];
        }

        async function onEnterpriseClick(name, lat, lon) {
            console.log('click', name, lat, lon);
            clearConnections();
            var r = await fetch('/similar/' + encodeURIComponent(name));
            console.log('status', r.status);
            var data = await r.json();
            console.log('data', data);
            showConnections(lat, lon, data);
            console.log('lines', connectionLines.length);
        }

        function renderTable(results) {
            var table = document.getElementById('results');
            table.innerHTML = '';                       // очистить старые строки

            var head = table.insertRow();
            ['Предприятие', 'Сходство', 'Пригодность'].forEach(function (t) {
                var th = document.createElement('th');
                th.textContent = t;
                head.appendChild(th);
            });

            results.forEach(function (x) {
                var row = table.insertRow();
                row.insertCell().textContent = x.enterprise;
                row.insertCell().textContent = (x.score * 100).toFixed(1) + '%';
                var cell = row.insertCell();
                cell.textContent = x.suitability.toFixed(2);
                cell.style.background = suitColor(x.suitability);
            });
        }
        function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

        function suitColor(s) {
            return s >= 0.75 ? '#22c55e' : s >= 0.5 ? '#eab308' : s >= 0.25 ? '#f97316' : '#ef4444';
        }

        async function doSearch() {
            var query = document.getElementById('q').value.trim();
            if (!query) return;
            var r = await fetch('/search', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    query: query, top_k: 8,
                    accessibility: document.getElementById('acc').value / 100,
                    cost: document.getElementById('cost').value / 100
                })
            });
            var results = (await r.json()).results;
            clearMap();
            results.forEach(function (x) {
                addPoint(x.lat, x.lon, suitColor(x.suitability),
                    esc(x.enterprise) + '<br>Пригодность: ' + x.suitability.toFixed(2),
                    x.enterprise);
            });
            renderTable(results);
        }

        document.getElementById('q').addEventListener('keydown', function (e) { if (e.key === 'Enter') doSearch(); });
        document.getElementById('acc').addEventListener('change', doSearch);
        document.getElementById('cost').addEventListener('change', doSearch);
    </script>
</body>

</html>
